[project]
name = "nowcoder-crawler"
version = "0.1.0"
description = "A small RabbitMQ-based live crawler for public Nowcoder interview posts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aio-pika>=9.5,<10",
  "httpx>=0.28,<1",
  "pymysql>=1.1,<2",
  "sqlalchemy>=2.0,<3",
]

[project.scripts]
nowcoder-crawler = "nowcoder_crawler.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nowcoder_crawler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

